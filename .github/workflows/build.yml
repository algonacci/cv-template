name: Build CV

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: xu-cheng/latex-action@v3
        with:
          root_file: "*/main.tex"
          glob_root_file: true
          work_in_root_file_dir: true
      - uses: actions/upload-artifact@v4
        with:
          name: cv-pdf
          path: "*/main.pdf"
